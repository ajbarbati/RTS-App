name: test
   on:
     push:
     pull_request:
   jobs:
     test:
       runs-on: ubuntu-latest
       services:
         postgres:
           image: postgres:16
           env:
             POSTGRES_USER: rts
             POSTGRES_PASSWORD: rts
             POSTGRES_DB: rts
           ports:
             - 5432:5432
           options: >-
             --health-cmd "pg_isready -U rts -d rts"
             --health-interval 5s
             --health-timeout 5s
             --health-retries 10
       env:
         DATABASE_URL: postgresql://rts:rts@localhost:5432/rts
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 22
             cache: npm
         - run: npm ci
         - run: npx prisma generate
         - run: npx prisma migrate deploy
         - run: npm run lint
         - run: npm test