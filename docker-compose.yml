services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rts
      POSTGRES_PASSWORD: rts
      POSTGRES_DB: rts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rts -d rts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
